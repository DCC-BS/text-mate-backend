[project]
name = "text_mate_backend"
version = "1.8.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "dependency-injector>=4.48.3",
    "fastapi-azure-auth>=5.2.0",
    "fastapi[standard]>=0.128.2",
    "structlog>=25.5.0",
    "pydantic-ai<2.57.1",
    "pyyaml>=6.0.2",
    "dcc-backend-common[fastapi]>=0.1.21",
    "fast-langdetect>=1.0.1",
    "pyphen>=0.17.2",
    "zix @ git+https://github.com/machinelearningZH/zix_understandability-index@2404daf01e35abb613feac4f653f2eb0ae2e54d8",
    # Pin scikit-learn to match the version zix's bundled pickles were built with.
    # The pickles in zix/data/*.pkl carry the version string 1.9.1 (zix 0.2.5); a
    # mismatched version makes every load raise sklearn's InconsistentVersionWarning
    # ("may lead to invalid results").
    # `zix` itself is pinned to commit 2404daf01e35abb613feac4f653f2eb0ae2e54d8 (0.2.5) --
    # re-check this when bumping zix.
    "scikit-learn>=1.9.1,<2",
]

[dependency-groups]
dev = [
    "logfire>=4.22.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.22.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.13",
    "version-pioneer>=0.0.13",
    "ty>=0.0.12",
    "tqdm>=4.67.1",
    "types-tqdm>=4.67.0.20250809",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/text_mate_backend"]

[tool.ruff]
# Same as Black.
line-length = 120
indent-width = 4

target-version = "py313"

[tool.ruff.lint]
# Add rules to enable
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]

# Ignore specific rules
ignore = ["E501"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
# Group imports by type (standard library, third-party, first-party).
combine-as-imports = true
force-wrap-aliases = true



[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["src"]

[tool.uv]
# Supply-chain cooldown: uv only uses distributions uploaded at least 7 days ago.
exclude-newer = "P7D"
# dcc-backend-common: our own package(s), always current (permanent).
# TEMPORARY until 2026-11-03: pyasn1 skip the cooldown (P0D) so the locked security fixes
# aren't downgraded: pyasn1 0.6.5 (GHSA-2qm8-x737-gmw5, uploaded 2026-10-27).
# The weekly dependency routine removes these entries once the locked versions are 7 days old.
exclude-newer-package = { dcc-backend-common = "P0D", pyasn1 = "P0D" }
