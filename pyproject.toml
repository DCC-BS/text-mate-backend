[project]
name = "text_mate_backend"
version = "1.7.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "dependency-injector>=4.48.3",
    "fastapi-azure-auth>=5.2.0",
    "fastapi[standard]>=0.128.2",
    "structlog>=25.5.0",
    "pydantic-ai<2.22.1",
    "pyyaml>=6.0.2",
    "dcc-backend-common[fastapi]>=0.1.21",
    "fast-langdetect>=1.0.1",
    "pyphen>=0.17.2",
    "zix @ git+https://github.com/machinelearningZH/zix_understandability-index@5ffee0a209339f39923d3f10a047e08412d209e9",
    # Pin scikit-learn to match the version zix's bundled pickles were built with.
    # The pickles in zix/data/*.pkl carry the version string 1.9.0; an earlier <1.9 pin
    # excluded exactly the version it was meant to match, so every load raised
    # sklearn's InconsistentVersionWarning ("may lead to invalid results").
    # `zix` itself is pinned to commit 5ffee0a209339f39923d3f10a047e08412d209e9 --
    # re-check this when bumping zix.
    "scikit-learn>=1.9,<2",
]

[dependency-groups]
dev = [
    "logfire>=4.22.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.22.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.13",
    "version-pioneer>=0.0.13",
    "ty>=0.0.12",
    "tqdm>=4.67.1",
    "types-tqdm>=4.67.0.20250809",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/text_mate_backend"]

[tool.ruff]
# Same as Black.
line-length = 120
indent-width = 4

target-version = "py313"

[tool.ruff.lint]
# Add rules to enable
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]

# Ignore specific rules
ignore = ["E501"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
# Group imports by type (standard library, third-party, first-party).
combine-as-imports = true
force-wrap-aliases = true



[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["src"]

[tool.uv]
exclude-newer = "P7D"
exclude-newer-package = { dcc-backend-common = "P0D" }
