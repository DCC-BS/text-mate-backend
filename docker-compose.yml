services:
    vllm_gemma4:
        platform: linux/amd64
        image: vllm/vllm-openai:v0.32.0
        container_name: vllm_gemma4
        ports:
            - ${LLM_API_PORT:-8001}:8000
        environment:
            - HF_TOKEN=${HF_TOKEN:-}
        # GPU via CDI device name — verified working on:
        # - rootless Docker (daemon reads /etc/cdi specs; no group membership
        #   needed, container root maps to your user)
        # - rootful Docker >= 28.2 (CDI default-on; 25.0-28.1 need
        #   `features.cdi: true` in daemon.json) with docker compose >= 2.30
        # - Podman (same syntax, natively)
        # Legacy rootful Docker with the toolkit hook instead of CDI:
        #   deploy:
        #     resources:
        #       reservations:
        #         devices:
        #           - driver: nvidia
        #             device_ids: ["${VLLM_GPU_ID:-1}"]
        #             capabilities: [gpu]
        devices:
            # GPU index on the HOST (nvidia-smi numbering); override with
            # VLLM_GPU_ID on single-GPU hosts.
            - "nvidia.com/gpu=${VLLM_GPU_ID:-1}"
        ipc: host
        networks:
            default:
                aliases: [vllm]
        volumes:
            - "${HF_CACHE_DIR:-${HOME}/cache/huggingface}:/root/.cache/huggingface"
        command: >
            RedHatAI/gemma-4-31B-it-NVFP4
            --port 8000
            --served-model-name Gemma/Gemma-4-31B
            --max-model-len auto
            --max-num-batched-tokens 4096
            --gpu-memory-utilization 0.90
            --enable-auto-tool-choice
            --tool-call-parser gemma4
            --chat-template examples/tool_chat_template_gemma4.jinja
            --async-scheduling
            --tensor-parallel-size 1
            --max-num-seqs 1
            --reasoning-parser gemma4
            --cpu-offload-gb 20
            --enforce-eager
            --limit-mm-per-prompt '{"image": 0, "video": 0}'
            --disable_chunked_mm_input

    docling-serve:
        image: ghcr.io/dcc-bs/dcc-docling-serve-cpu:v1.36.0
        container_name: docling-serve-text-mate
        ports:
            - ${DOCLING_API_PORT:-5001}:5001
        environment:
            - DOCLING_MODELS_PATH=/models
            - DOCLING_CONFIG_FILE=/app/docling_config.json
            - DOCLING_SERVE_ENABLE_UI=true
        volumes:
            # Cache dir must be a HOST-side path (resolvable where the daemon
            # runs). Inside dev containers HF_CACHE_DIR/DOCLING_CACHE_DIR are
            # set via remoteEnv to ${localEnv:HOME}/... so all workspaces and
            # host-native runs share one cache.
            - "${DOCLING_CACHE_DIR:-${HOME}/.cache/docling}:/models"
        networks:
            default:
                aliases: [docling]

# Shared with the devcontainer workspaces: their postStartCommand joins this
# network so containers reach the services by alias (http://vllm:8000,
# http://docling:5001) — see the $REMOTE_CONTAINERS branches in .env.schema.
# Compose creates it if missing, so host-native runs keep working.
networks:
    default:
        name: textmate-dev
