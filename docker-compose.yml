services:
    vllm_gemma4:
        platform: linux/amd64
        image: vllm/vllm-openai:v0.26.0
        container_name: vllm_gemma4
        ports:
            - ${LLM_API_PORT:-8001}:8000
        environment:
            - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          device_ids: ["0", "1"]
                          capabilities: [gpu]
        ipc: host
        volumes:
            - ${HUGGING_FACE_CACHE_DIR:-${HOME}/cache/huggingface}:/root/.cache/huggingface
        command: >
            --port 8000
            --model RedHatAI/gemma-4-31B-it-NVFP4
            --served-model-name Gemma/Gemma-4-31B
            --max-model-len auto
            --max-num-batched-tokens 4096
            --gpu-memory-utilization 0.90
            --enable-auto-tool-choice
            --tool-call-parser gemma4
            --chat-template examples/tool_chat_template_gemma4.jinja
            --async-scheduling
            --tensor-parallel-size 2
            --max-num-seqs 1
            --reasoning-parser gemma4
            --enforce-eager
            --limit-mm-per-prompt '{"image": 0, "video": 0}'
            --disable_chunked_mm_input

    docling-serve:
        image: ghcr.io/dcc-bs/dcc-docling-serve-cpu:v1.30.0
        container_name: docling-serve-text-mate
        ports:
            - ${DOCLING_API_PORT:-5001}:5001
        environment:
            - DOCLING_MODELS_PATH=/models
            - DOCLING_CONFIG_FILE=/app/docling_config.json
            - DOCLING_SERVE_ENABLE_UI=true
        volumes:
            - "${HOME:-/root}/.cache/docling:/models"
